name: build
on:
  schedule: [{ cron: "0 * * * *" }]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/ingest.py --sheet "${{ secrets.SHEET_URL }}"
      - run: python3 scripts/build.py
      - run: |
          git config user.name "ck-bot"
          git config user.email "bot@campuskings"
          git add -A
          git diff --staged --quiet || git commit -m "auto: refresh from sheet"
          git push
