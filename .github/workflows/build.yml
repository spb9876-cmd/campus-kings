name: build

on:
  # Pull the Sheet on the hour and check it still builds
  schedule: [{ cron: "0 * * * *" }]
  # "Run workflow" button in the Actions tab
  workflow_dispatch:
  # Validate every push
  push:
    branches: [main]

concurrency:
  group: build
  cancel-in-progress: false

# Scheduled and manual runs pull the Sheet, rebuild, and commit the result --
# Pages deploys from the docs/ folder on main, so that commit IS the publish.
# Push runs stay validate-only: they build exactly what was committed, and the
# auto-commit itself triggers one, which is how a scheduled publish gets its
# green check without looping.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # Only on scheduled / manual runs. A push builds exactly what was committed.
      - name: Refresh season data from the Sheet
        if: github.event_name != 'push'
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: |
          if [ -z "$SHEET_URL" ]; then
            echo "::error::SHEET_URL secret is not set - add it under Settings > Secrets and variables > Actions"
            exit 1
          fi
          python3 scripts/ingest.py --sheet "$SHEET_URL"

      - name: Regression tests
        run: python3 scripts/test_points.py

      - name: Build site
        run: python3 scripts/build.py

      # New scores flow straight to the live site: if ingest changed the season
      # data, commit it together with the rebuilt docs/ and push. Pages picks
      # the commit up on its own. Push-triggered runs never reach this step.
      - name: Publish refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No new scores - nothing to publish."
          else
            git commit -m "Auto-publish: new results from the Sheet"
            git push
          fi
