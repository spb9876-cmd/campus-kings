name: build

on:
  # Pull the Sheet on the hour and check it still builds
  schedule: [{ cron: "0 * * * *" }]
  # "Run workflow" button in the Actions tab
  workflow_dispatch:
  # Validate every push
  push:
    branches: [main]

concurrency:
  group: build
  cancel-in-progress: false

# Read-only. This workflow does not publish and does not commit -- Pages deploys
# from the docs/ folder on main, which your own `git push` updates. That is why
# there are no configure-pages / upload-pages-artifact steps here: those fail
# unless Settings > Pages > Source is set to "GitHub Actions".
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # Only on scheduled / manual runs. A push builds exactly what was committed.
      - name: Refresh season data from the Sheet
        if: github.event_name != 'push'
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: |
          if [ -z "$SHEET_URL" ]; then
            echo "::error::SHEET_URL secret is not set - add it under Settings > Secrets and variables > Actions"
            exit 1
          fi
          python3 scripts/ingest.py --sheet "$SHEET_URL"

      - name: Regression tests
        run: python3 scripts/test_points.py

      - name: Build site
        run: python3 scripts/build.py

      # Nothing is committed or deployed. If the Sheet had new scores, this run
      # proves they ingest and build cleanly; run ingest locally and push to
      # publish them.
      - name: Summary
        run: echo "Validated. Deploys happen from committed docs/ on push."
