name: build

on:
  # Pull the Sheet twice a day: 9am and 9pm Central (14:00 / 02:00 UTC)
  schedule: [{ cron: "0 2,14 * * *" }]
  # "Run workflow" button in the Actions tab fires it on demand
  workflow_dispatch:
  # Validate every push
  push:
    branches: [main]

concurrency:
  group: build
  cancel-in-progress: false

# Scheduled and manual runs pull the Sheet, rebuild, and commit the result --
# Pages deploys from the docs/ folder on main, so that commit IS the publish.
# Push runs stay validate-only: they build exactly what was committed, and the
# auto-commit itself triggers one, which is how a scheduled publish gets its
# green check without looping.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # Only on scheduled / manual runs. A push builds exactly what was committed.
      - name: Refresh season data from the Sheet
        if: github.event_name != 'push'
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: |
          if [ -z "$SHEET_URL" ]; then
            echo "::error::SHEET_URL secret is not set - add it under Settings > Secrets and variables > Actions"
            exit 1
          fi
          python3 scripts/ingest.py --sheet "$SHEET_URL"

      - name: Regression tests
        run: python3 scripts/test_points.py

      - name: Build site
        run: python3 scripts/build.py

      # Tripwire for the class of bug that once shipped a video-less hero from
      # this runner (Windows/Linux folder-case mismatch): if the built homepage
      # has no clip rotation or the poster is missing, fail loudly instead of
      # publishing. Remove this check only if hero video is retired on purpose.
      - name: Hero clips sanity check
        run: |
          grep -q "data-clips" docs/index.html
          test -f docs/media/video/hero-poster.jpg
          test "$(ls docs/media/video/*.mp4 | wc -l)" -ge 4

      # New scores flow straight to the live site: if ingest changed the season
      # data, commit it together with the rebuilt docs/ and push. Pages picks
      # the commit up on its own. Push-triggered runs never reach this step.
      - name: Publish refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage data/ first and gate on it alone: the footer's build date
          # changes docs/ every day, which used to produce twice-daily
          # "new results" commits that contained no results.
          git add data
          if git diff --cached --quiet; then
            echo "No new scores - nothing to publish."
          else
            git add docs
            git commit -m "Auto-publish: new results from the Sheet"
            git push
          fi
